services:
  - type: web
    name: princehacker
    runtime: python
    branch: main
    autoDeployTrigger: commit
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PACKAGE_NAME
        value: com.princeofworld.familyguard
      - key: PLAY_SUBSCRIPTION_PRODUCT_ID
        value: familyguard_premium_999_monthly
      - key: PLAY_SUBSCRIPTION_BASE_PLAN_ID
        value: monthly-999
      - key: INVITE_TTL_MINUTES
        value: 15
      - key: DATABASE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_ENABLED
        value: "false"
