<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081426"><title>FamilyGuard Admin</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#081426;color:#eef5ff;font:16px system-ui}main{max-width:900px;margin:auto}h1{color:#54dfbd}.muted{color:#aebed2}.item{background:#13243a;border:1px solid #2d4562;border-radius:14px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.btn{padding:11px 16px;border:0;border-radius:9px;margin:8px 8px 0 0;font-weight:700}.yes{background:#54dfbd}.no{background:#ffb4ab}#status{white-space:pre-wrap}button{cursor:pointer}
</style></head><body><main><h1>FamilyGuard Admin</h1><p class="muted">Manual UPI review. Verify the exact 12-digit UTR and ₹999 credit against your bank's official transaction history before approving. Approval activates Premium for 30 days across Android and the website. A submitted UTR is not proof of payment.</p><p id="status">Admin sign-in required.</p><button class="btn yes" id="signin">Sign in</button><button class="btn" id="refresh">Refresh</button><button class="btn" id="telegram-test">Send Telegram test</button><div id="list"></div></main><script>
let authHeader="";
async function ensureAuth(){if(authHeader)return true;const user=prompt("Admin username");if(user===null)return false;const pass=prompt("Admin password");if(pass===null)return false;authHeader="Basic "+btoa(unescape(encodeURIComponent(user+":"+pass)));return true}
async function request(url,options={}){if(!await ensureAuth())throw Error("Sign-in cancelled");const headers={...(options.headers||{}),Authorization:authHeader};if(options.body)headers["Content-Type"]="application/json";let r=await fetch(url,{...options,headers});if(r.status===401){authHeader="";throw Error("Admin sign-in failed. Tap Sign in and try again.")}return r}
async function load(){const status=document.getElementById("status"),list=document.getElementById("list");status.textContent="Loading pending UTRs…";try{const r=await request("/admin/api/payments?status=pending");const d=await r.json();if(!r.ok)throw Error(d.detail||"Could not load payments");status.textContent="Pending UTRs: "+d.payments.length;list.replaceChildren();for(const p of d.payments){const card=document.createElement("section");card.className="item";const h=document.createElement("h3");h.textContent="₹"+(p.amount_paise/100).toFixed(2)+" · UTR "+p.utr;const meta=document.createElement("p");meta.className="muted";meta.textContent="Account: "+p.email+" · Submitted: "+new Date(p.created*1000).toLocaleString();const approve=document.createElement("button");approve.className="btn yes";approve.textContent="Approve 30 days";approve.onclick=()=>act(p.id,"approve");const reject=document.createElement("button");reject.className="btn no";reject.textContent="Reject";reject.onclick=()=>act(p.id,"reject");card.append(h,meta,approve,reject);list.append(card)}}catch(e){status.textContent=e.message}}
async function act(id,action){if(action==="approve"&&!confirm("Only approve after verifying the ₹999 credit and exact UTR in your bank app or statement. Continue?"))return;const note=action==="reject"?(prompt("Reason (optional):")||""):"Verified against bank statement";try{const r=await request("/admin/api/payments/"+encodeURIComponent(id)+"/"+action,{method:"POST",body:JSON.stringify({note})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Action failed");alert(d.message||"Updated");load()}catch(e){alert(e.message)}}
document.getElementById("signin").onclick=()=>{authHeader="";ensureAuth().then(ok=>{if(ok)load()})};document.getElementById("refresh").onclick=load;document.getElementById("telegram-test").onclick=async()=>{const status=document.getElementById("status");try{status.textContent="Sending Telegram test…";const r=await request("/admin/api/telegram/test",{method:"POST"});const d=await r.json();if(!r.ok)throw Error(d.detail||"Telegram test failed");status.textContent="Telegram test sent. Check your Telegram chat."}catch(e){status.textContent=e.message}};load();
</script></body></html>
