<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Login · Golden Prince</title><style>body{background:#071426;color:#edf5ff;font-family:system-ui}.panel{background:#10243a;border:1px solid #29415d;border-radius:24px}input{width:100%;background:#071426;border:1px solid #38516d;border-radius:12px;padding:14px;color:white;margin-top:7px}.muted{color:#a9bbd1}</style></head><body class="min-h-screen grid place-items-center p-5"><main class="w-full max-w-md"><a href="/" class="flex items-center gap-3 mb-6 text-xl font-bold"><img src="/golden-prince-logo.jpg" alt="Golden Prince crown logo" width="64" height="64" class="rounded-lg object-contain"><span>Golden Prince</span></a><section class="panel p-7"><p class="text-teal-300 text-xs font-bold tracking-widest">YOUR ACCOUNT</p><h1 class="text-3xl font-black mt-2">Welcome</h1><p class="muted mt-2">Use the same credentials as the Android app.</p><div class="grid grid-cols-2 gap-2 mt-6"><button id="login-mode" class="p-3 rounded-xl bg-blue-600">Sign in</button><button id="signup-mode" class="p-3 rounded-xl border border-slate-600">Create account</button></div><form id="form" class="space-y-4 mt-6"><label class="block text-sm">Email<input id="email" type="email" autocomplete="username" required></label><label class="block text-sm">Password<input id="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></label><button id="submit" class="w-full p-4 rounded-xl bg-gradient-to-r from-blue-500 to-teal-400 text-slate-950 font-bold">Sign in</button></form><p id="message" role="status" class="text-sm mt-4 min-h-6"></p></section><a href="/" class="block text-center muted mt-5">← Home</a></main><script src="/login.js" defer></script></body></html>
