services:
  - type: web
    name: princehacker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PACKAGE_NAME
        value: com.princeofworld.familyguard
      - key: PLAY_SUBSCRIPTION_PRODUCT_ID
        value: familyguard_premium_999_monthly
      - key: PLAY_SUBSCRIPTION_BASE_PLAN_ID
        value: monthly-999
      - key: INVITE_TTL_MINUTES
        value: 15
