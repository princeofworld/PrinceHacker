name: FamilyGuard Live E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: familyguard-live-e2e
  cancel-in-progress: false

jobs:
  live-e2e:
    name: Live production E2E (isolated CI bot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL }}
      RENDER_EXTERNAL_URL: ${{ vars.RENDER_EXTERNAL_URL }}
      LIVE_E2E_TEST_PASSWORD: ${{ secrets.LIVE_E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Render auto-deploy and public routes
        shell: bash
        run: |
          BASE_URL="${LIVE_BASE_URL:-${RENDER_EXTERNAL_URL:-https://princehacker.onrender.com}}"
          BASE_URL="${BASE_URL%/}"
          echo "Waiting for Render deployment at ${BASE_URL}"
          for attempt in $(seq 1 30); do
            health_code=$(curl -sS -o /tmp/fg-health.json -w '%{http_code}' --max-time 15 "${BASE_URL}/health" || true)
            login_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL}/login" || true)
            dashboard_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL}/dashboard" || true)
            admin_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL}/admin" || true)
            if [[ "${health_code}" == "200" && "${login_code}" == "200" && "${dashboard_code}" == "200" && "${admin_code}" == "200" ]]; then
              echo "Render health and all friendly dashboard routes are ready."
              cat /tmp/fg-health.json
              exit 0
            fi
            echo "Attempt ${attempt}/30: health=${health_code}, login=${login_code}, dashboard=${dashboard_code}, admin=${admin_code}; waiting 20 seconds."
            sleep 20
          done
          echo "Render did not finish deploying the expected public routes within 10 minutes."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install live test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Run production live E2E
        id: live-tests
        run: pytest tests/test_live_e2e.py -v

      - name: Publish live verification summary
        if: always()
        run: |
          {
            echo "## FamilyGuard Live E2E"
            echo ""
            echo "- Target: ${LIVE_BASE_URL:-${RENDER_EXTERNAL_URL:-https://princehacker.onrender.com}}"
            if [[ "${{ steps.live-tests.outcome }}" == "success" ]]; then
              echo "- Result: **100% LIVE E2E VERIFIED**"
              echo "- Health, dashboard pages, authentication, dashboard APIs, SOS lifecycle, consent revocation, blocked uploads, and cleanup passed."
            else
              echo "- Result: **LIVE E2E FAILED**"
              echo "- Inspect the test log above for the failing assertion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
