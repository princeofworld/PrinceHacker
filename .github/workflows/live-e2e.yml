name: Golden Prince Live E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-prince-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    name: Live production E2E (isolated CI bot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_BASE_URL: https://princehacker.onrender.com
      LIVE_E2E_TEST_PASSWORD: ${{ secrets.LIVE_E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Render auto-deploy and public routes
        shell: bash
        run: |
          BASE_URL="${LIVE_BASE_URL%/}"
          echo "Waiting up to 30 minutes for Render health and public routes at ${BASE_URL}"
          ready=false
          for attempt in $(seq 1 16); do
            health_code=$(curl -sS -L -o /tmp/fg-health.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "${BASE_URL}/health" || true)
            root_code="000"; login_code="000"; dashboard_code="000"; admin_code="000"; admin_slash_code="000"
            if [[ "${health_code}" == "200" ]]; then
              root_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 25 "${BASE_URL}/" || true)
              login_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 25 "${BASE_URL}/login" || true)
              dashboard_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 25 "${BASE_URL}/dashboard" || true)
              admin_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 25 "${BASE_URL}/admin" || true)
              admin_slash_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 25 "${BASE_URL}/admin/" || true)
            fi
            echo "Attempt ${attempt}/16: health=${health_code} root=${root_code} login=${login_code} dashboard=${dashboard_code} admin=${admin_code} admin_slash=${admin_slash_code}"
            if [[ "${health_code}" == "200" && "${root_code}" == "200" && "${login_code}" == "200" && "${dashboard_code}" == "200" && "${admin_code}" == "200" && "${admin_slash_code}" == "200" ]]; then
              ready=true
              break
            fi
            if [[ "${attempt}" -lt 16 ]]; then sleep 15; fi
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Render health or one or more public routes did not become ready within 30 minutes."
            echo "Last health response:"
            cat /tmp/fg-health.json || true
            exit 1
          fi
          echo "Render health and public routes are ready. Dashboard structure and behavior will be verified by pytest."
          cat /tmp/fg-health.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install live test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Run production live E2E
        id: live-tests
        run: pytest tests/test_live_e2e.py -v

      - name: Publish live verification summary
        if: always()
        run: |
          {
            echo "## Golden Prince Live E2E"
            echo ""
            echo "- Target: ${LIVE_BASE_URL:-${RENDER_EXTERNAL_URL:-https://princehacker.onrender.com}}"
            if [[ "${{ steps.live-tests.outcome }}" == "success" ]]; then
              echo "- Result: **100% LIVE E2E VERIFIED**"
              echo "- Health, dashboard pages, authentication, dashboard APIs, SOS lifecycle, consent revocation, blocked uploads, and cleanup passed."
            else
              echo "- Result: **LIVE E2E FAILED**"
              echo "- Inspect the test log above for the failing assertion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
