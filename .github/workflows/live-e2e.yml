name: FamilyGuard Live E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: familyguard-live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    name: Live production E2E (isolated CI bot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL }}
      RENDER_EXTERNAL_URL: ${{ vars.RENDER_EXTERNAL_URL }}
      LIVE_E2E_TEST_PASSWORD: ${{ secrets.LIVE_E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Render auto-deploy and public routes
        shell: bash
        run: |
          BASE_URL="${LIVE_BASE_URL:-${RENDER_EXTERNAL_URL:-https://princehacker.onrender.com}}"
          BASE_URL="${BASE_URL%/}"
          echo "Waiting for Render health at ${BASE_URL} (12 bounded attempts, 5 seconds each)"
          health_ready=false
          for attempt in $(seq 1 12); do
            health_code=$(curl -sS -o /tmp/fg-health.json -w '%{http_code}' --connect-timeout 1 --max-time 2 "${BASE_URL}/health" || true)
            if [[ "${health_code}" == "200" ]]; then
              health_ready=true
              break
            fi
            echo "Health attempt ${attempt}/12 returned ${health_code:-000}"
            if [[ "${attempt}" -lt 12 ]]; then sleep 3; fi
          done
          if [[ "${health_ready}" != "true" ]]; then
            echo "Render health did not become ready within the bounded 60-second window."
            exit 1
          fi
          login_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 1 --max-time 3 "${BASE_URL}/login" || true)
          dashboard_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 1 --max-time 3 "${BASE_URL}/dashboard" || true)
          admin_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 1 --max-time 3 "${BASE_URL}/admin" || true)
          if [[ "${login_code}" != "200" || "${dashboard_code}" != "200" || "${admin_code}" != "200" ]]; then
            echo "Public route check failed: login=${login_code}, dashboard=${dashboard_code}, admin=${admin_code}"
            exit 1
          fi
          echo "Render health and all friendly dashboard routes are ready."
          cat /tmp/fg-health.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install live test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Run production live E2E
        id: live-tests
        run: pytest tests/test_live_e2e.py -v

      - name: Publish live verification summary
        if: always()
        run: |
          {
            echo "## FamilyGuard Live E2E"
            echo ""
            echo "- Target: ${LIVE_BASE_URL:-${RENDER_EXTERNAL_URL:-https://princehacker.onrender.com}}"
            if [[ "${{ steps.live-tests.outcome }}" == "success" ]]; then
              echo "- Result: **100% LIVE E2E VERIFIED**"
              echo "- Health, dashboard pages, authentication, dashboard APIs, SOS lifecycle, consent revocation, blocked uploads, and cleanup passed."
            else
              echo "- Result: **LIVE E2E FAILED**"
              echo "- Inspect the test log above for the failing assertion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
