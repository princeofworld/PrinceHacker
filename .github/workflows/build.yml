name: FamilyGuard Direct APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and verify signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate backend
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::A signed APK requires all four repository signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. No unsigned file will be published as signed."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/familyguard-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FAMILYGUARD_API_BASE_URL: https://princehacker.onrender.com
        run: gradle --no-daemon --stacktrace -PfamilyguardApiBaseUrl="https://princehacker.onrender.com" :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose "${APK}"
          mkdir -p release-artifacts
          cp "${APK}" release-artifacts/FamilyGuard-release-signed.apk
          sha256sum release-artifacts/FamilyGuard-release-signed.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Signed-APK
          path: release-artifacts/FamilyGuard-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="familyguard-v1.3.1-build-${GITHUB_RUN_NUMBER}"
          gh release create "${TAG}" release-artifacts/FamilyGuard-release-signed.apk \
            --title "FamilyGuard 1.3.1 - Build #${GITHUB_RUN_NUMBER}" \
            --notes "Direct website APK release. APK signature was verified by apksigner in GitHub Actions. No Play Store AAB is produced."
