name: FamilyGuard Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate and commit Play Store PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="playstore-assets/app_icon.svg", write_to="playstore-assets/app_icon_512.png", output_width=512, output_height=512)
          cairosvg.svg2png(url="playstore-assets/feature_graphic.svg", write_to="playstore-assets/feature_graphic.png", output_width=1024, output_height=500)
          PY
          file playstore-assets/app_icon_512.png playstore-assets/feature_graphic.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playstore-assets/app_icon_512.png playstore-assets/feature_graphic.png
          if ! git diff --cached --quiet; then
            git commit -m "Add rendered Play Store PNG graphics"
            git push origin HEAD:main
          else
            echo "Play Store PNG assets are already current."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare optional release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            if [[ -n "${ANDROID_KEYSTORE_PASSWORD}" || -n "${ANDROID_KEY_ALIAS}" || -n "${ANDROID_KEY_PASSWORD}" ]]; then
              echo "::error::Signing secrets are incomplete: set ANDROID_KEYSTORE_BASE64 and all three matching signing secrets, or leave all four unset."
              exit 1
            fi
            echo "Signing secrets are not configured; producing clearly labelled unsigned release artifacts."
            exit 0
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but one or more required signing secrets are missing."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/familyguard-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"
          echo "Release keystore decoded into runner temp storage (not an artifact)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK and Play Store bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FAMILYGUARD_VERIFY_URL: ${{ secrets.FAMILYGUARD_API_BASE_URL || secrets.FAMILYGUARD_VERIFY_URL }}
          FAMILYGUARD_API_BASE_URL: ${{ secrets.FAMILYGUARD_API_BASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: gradle --no-daemon --stacktrace -PfamilyguardVerifyUrl="${FAMILYGUARD_VERIFY_URL:-}" -PfamilyguardApiBaseUrl="${FAMILYGUARD_API_BASE_URL:-}" :app:assembleRelease :app:bundleRelease

      - name: Verify and stage release outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            AAB="app/build/outputs/bundle/release/app-release.aab"
            test -s "${APK}"
            test -s "${AAB}"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            if [[ -z "${APKSIGNER}" || ! -x "${APKSIGNER}" ]]; then
              echo "::error::Android SDK build-tools apksigner was not found or is not executable."
              exit 1
            fi
            "${APKSIGNER}" verify --verbose "${APK}"
            jarsigner -verify -verbose -certs "${AAB}" >/dev/null
            cp "${APK}" release-artifacts/FamilyGuard-release-signed.apk
            cp "${AAB}" release-artifacts/FamilyGuard-release-signed.aab
            echo "Signed APK and AAB signatures verified."
          else
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            AAB="app/build/outputs/bundle/release/app-release.aab"
            test -s "${APK}"
            test -s "${AAB}"
            cp "${APK}" release-artifacts/FamilyGuard-release-unsigned.apk
            cp "${AAB}" release-artifacts/FamilyGuard-release-unsigned.aab
            echo "::warning::Artifacts are unsigned. They are for local testing only; configure the four ANDROID_* signing secrets before Play Store upload."
          fi
          sha256sum release-artifacts/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Release-Artifacts
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
