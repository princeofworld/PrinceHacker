name: Golden Prince APK Build

on:
  push:
    branches: [ main, 'feat/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-prince-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify Golden Prince APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: familyguard_test
          POSTGRES_USER: familyguard
          POSTGRES_PASSWORD: familyguard_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familyguard -d familyguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql://familyguard:familyguard_test_password@localhost:5432/familyguard_test?sslmode=disable
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate backend
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend

      - name: Run SQLite and PostgreSQL security regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest httpx
          pytest -q backend/tests

      - name: Validate dashboard JavaScript and navigation
        run: |
          node --check web/login.js
          node --check web/dashboard.js
          node --check web/dashboard-features.js
          node --check web/media-gallery.js
          node web/dashboard-smoke.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Select signed release or debug fallback
        id: build-config
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/familyguard-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=Golden Prince-release-signed.apk" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets are not all configured; building a debug APK fallback. It is not a Play Store release."
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=Golden Prince-debug-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FAMILYGUARD_API_BASE_URL: https://princehacker.onrender.com
          BUILD_TYPE: ${{ steps.build-config.outputs.build_type }}
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version
          if [[ "$BUILD_TYPE" == "release" ]]; then
            gradle --no-daemon --stacktrace -PfamilyguardApiBaseUrl="https://princehacker.onrender.com" :app:assembleRelease
          else
            gradle --no-daemon --stacktrace -PfamilyguardApiBaseUrl="https://princehacker.onrender.com" :app:assembleDebug
          fi

      - name: Verify and stage APK
        env:
          APK_PATH: ${{ steps.build-config.outputs.apk_path }}
          APK_NAME: ${{ steps.build-config.outputs.artifact_name }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/$APK_NAME"
          sha256sum "release-artifacts/$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Golden Prince-APK
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed release APK
        if: ${{ steps.build-config.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="golden-prince-v1.3.4-build-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" release-artifacts/Golden Prince-release-signed.apk \
            --title "Golden Prince 1.3.4 - Build #$GITHUB_RUN_NUMBER" \
            --notes "Official signed Golden Prince APK. APK signature was verified by apksigner in GitHub Actions."
